:root {

  --white: #ffffff;
  --card: #ffffff;
  --border: #e8e4dc;
  --shadow: rgba(0,0,0,0.08);

  --text: #1a1a1a;

* { margin:0; padding:0; box-sizing:border-box; }

body {

.screen { display:none; min-height:100vh; }
.screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 20px; }

/* ── INTRO ── */
#intro {
  background: linear-gradient(160deg, #fff9f5 0%, #f0f4ff 100%);
  text-align: center;
  gap: 0;
}

.intro-badge {
  background: linear-gradient(135deg, var(--red), var(--blue));
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 16px;

}

.intro-title {

  line-height: 1.15;

}
.intro-title .highlight-red { color: var(--red); }
.intro-title .highlight-blue { color: var(--blue); }

.intro-sub {
  font-size: 16px;
  color: var(--text-mid);

  line-height: 1.7;
}

.spectrum-pill {
  display: flex;
  width: 100%;
  max-width: 320px;
  height: 10px;

.sp4{background:#2ab56e;flex:1} .sp5{background:#42aaee;flex:1} .sp6{background:#3c6fe8;flex:1} .sp7{background:#8b5cf6;flex:1}

.btn-start {

  font-weight: 900;

}
.btn-start:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(232,69,60,0.4); }
.btn-start:active { transform: translateY(0); }

.intro-note {
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-dim);
}

.char-row {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  justify-content: center;
}
.char-row svg {
  width: 52px;
  height: 52px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));

/* ── QUESTIONS ── */

  background: var(--bg);
  justify-content: flex-start;
  padding-top: 32px;
  gap: 0;
}

.progress-wrap {
  width: 100%;
  max-width: 580px;
  margin-bottom: 20px;
}
.progress-top {

  justify-content: space-between;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 8px;
  font-weight: 500;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 100px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--yellow), var(--blue));
  border-radius: 100px;
  transition: width 0.4s ease;
}

.page-label {
  width: 100%;
  max-width: 580px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text-dim);

  margin-bottom: 16px;
}

.q-card {

.q-text {

.likert {

  gap: 5px;

.lbtn {

  padding: 9px 4px;

  border-radius: 10px;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-dim);

  text-align: center;

.lbtn.sel-4 { background:#e8f4ff; border-color:#42aaee; color:#1a7fc0; font-weight:700; }

  justify-content: flex-end;

#loading {

.loading-icon {

.loading-title {

  font-weight: 900;

  letter-spacing: -0.5px;

.loading-sub {

.load-track {

.result-name {

.spectrum-wrap {

.spectrum-labels {

  justify-content: space-between;

  overflow: visible;
}
.spec-marker {
  position: absolute;
  top: -5px;
  width: 8px;
  height: 24px;
  background: #fff;
  border-radius: 4px;
  transform: translateX(-50%);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  transition: left 0.6s cubic-bezier(0.34,1.56,0.64,1);
}

.btn-row {

  gap: 10px;
  width: 100%;
  margin-bottom: 48px;
  flex-wrap: wrap;

.btn-outline {
  flex: 1;

.btn-kakao {

/* ── SHARED ── */
#shared {
  background: linear-gradient(160deg, #fff9f5 0%, #f0f4ff 100%);

  padding: 40px 20px;

  font-size: 13px;

  margin-top: 8px;

/* toast */
.toast {

  color: #fff;

  padding: 12px 28px;
  font-size: 14px;
  border-radius: 100px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
</style>

// ── STATE ─────────────────────────────────────
let answers = {};
let currentPage = 0;
let finalScore = null;

// ── SCORING ───────────────────────────────────
function calcScore() {
  let total = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    const raw = answers[i] || 3;
    total += QUESTIONS[i].dir === "cons" ? (6 - raw) : raw;
  }
  return total; // 20(최진보) ~ 100(최보수)
}
function scoreToResult(score) {
  const pct = (score - 20) / 80;
  return RESULTS[Math.min(6, Math.floor(pct * 7))];
}

// ── SCREENS ───────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function startTest() {
  answers = {}; currentPage = 0;
  renderPage(0); showScreen('questions');
}
function restartTest() { startTest(); }

// ── QUESTIONS ─────────────────────────────────
const LABELS = ["매우\n동의","동의","보통","반대","매우\n반대"];

function renderPage(page) {
  const start = page * 5;
  document.getElementById('page-label').textContent = `PART ${page+1} — 질문 ${start+1}-${start+5}`;
  updateProgress(Object.keys(answers).length);

  const container = document.getElementById('q-container');
  container.innerHTML = '';
  QUESTIONS.slice(start, start+5).forEach((q, i) => {
    const gi = start + i;
    const sel = answers[gi];
    const card = document.createElement('div');
    card.className = 'q-card';
    card.style.animationDelay = `${i * 0.07}s`;
    card.innerHTML = `
      <div class="q-num">Q${gi+1} / 20</div>
      <div class="q-text">${q.text}</div>
      <div class="likert">
        ${LABELS.map((l,li) => `<button class="lbtn ${sel===li+1?'sel-'+(li+1):''}"
          onclick="pickAnswer(${gi},${li+1},this)">${l}</button>`).join('')}
      </div>`;
    container.appendChild(card);
  });
  checkReady(page);
}

function pickAnswer(gi, val, btn) {
  answers[gi] = val;
  btn.closest('.likert').querySelectorAll('.lbtn').forEach((b,i) => b.className = `lbtn${answers[gi]===i+1?' sel-'+(i+1):''}`);
  checkReady(currentPage);
  updateProgress(Object.keys(answers).length);
}

function checkReady(page) {
  const start = page * 5;
  const ready = [0,1,2,3,4].every(i => answers[start+i] !== undefined);
  document.getElementById('btn-next').classList.toggle('ready', ready);
}

function updateProgress(count) {
  document.getElementById('pg-count').textContent = `${count} / 20`;
  document.getElementById('pg-fill').style.width = `${(count/20)*100}%`;
}

function nextPage() {
  const start = currentPage * 5;
  if (![0,1,2,3,4].every(i => answers[start+i] !== undefined)) return;
  currentPage++;
  if (currentPage >= 4) showLoading();
  else { 
    renderPage(currentPage); 
    window.scrollTo({ top: 0, behavior: 'smooth' }); // 다음 페이지 이동 시 스크롤 최상단 리셋 코드 추가
  }
}

// ── LOADING ───────────────────────────────────
function showLoading() {
  showScreen('loading');
  finalScore = calcScore();
  const fill = document.getElementById('load-fill');
  let p = 0;
  const iv = setInterval(() => {
    p += 2; fill.style.width = p + '%';
    if (p >= 100) { clearInterval(iv); setTimeout(showResult, 400); }
  }, 80);
}

// ── RESULT ────────────────────────────────────
function showResult(res) {
  res = res || scoreToResult(finalScore);
  const idx = RESULTS.findIndex(r => r.id === res.id);

  document.getElementById('r-badge').textContent = res.stage;
  document.getElementById('r-badge').style.background = res.bg;
  document.getElementById('r-name').textContent = res.title;
  document.getElementById('r-name').style.color = res.color;
  document.getElementById('r-desc').textContent = res.desc;
  document.getElementById('r-char').innerHTML = PIXEL_CHARS[idx];
  document.getElementById('r-marker').style.left = res.pct + '%';
  showScreen('result');
}

// ── SHARE ─────────────────────────────────────
function shareResult() {
  const res = scoreToResult(finalScore);
  const url = new URL(location.href.split('?')[0]);
  url.searchParams.set('shared','1');
  url.searchParams.set('rid', res.id);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url.toString()).then(showToast);
  } else {
    prompt('링크를 복사하세요:', url.toString());
  }
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── SHARED VIEW ───────────────────────────────
function initShared(params) {
  const rid = parseInt(params.get('rid'));
  const res = RESULTS.find(r => r.id === rid) || RESULTS[3];
  const idx = RESULTS.indexOf(res);
  document.getElementById('shared-inner').innerHTML = `
    <div class="result-eyebrow">친구의 정치성향</div>
    <div class="result-badge" style="background:${res.bg}">${res.stage}</div>
    <svg class="result-char" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">${PIXEL_CHARS[idx]}</svg>
    <div class="result-name" style="color:${res.color}">${res.title}</div>
    <div class="result-desc">${res.desc}</div>
    <div class="spectrum-wrap">
      <div class="spectrum-labels"><span>← 진보</span><span>보수 →</span></div>
      <div class="spectrum-bar2"><div class="spec-marker" style="left:${res.pct}%"></div></div>
    </div>`;
  showScreen('shared');
}

// ── INIT ──────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const p = new URLSearchParams(location.search);
  if (p.get('shared') === '1') initShared(p);
  else showScreen('intro');
});
